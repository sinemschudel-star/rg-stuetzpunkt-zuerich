<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RG Sponsoring</title>
<style>
:root{--blue:#0755a5;--blue2:#0b77d5;--gold:#d6a514;--bg:#f5f8fc;--green:#198754;--red:#c83d4d;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#152238}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px;text-align:center;font-weight:800;font-size:22px;letter-spacing:.6px}
.wrap{max-width:820px;margin:auto;padding:14px}
.logo{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 2px 10px #0001}
.logo img{display:block;width:100%;max-width:360px;height:auto;aspect-ratio:auto;object-fit:contain;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}
.stat b{display:block;font-size:21px;color:var(--blue)} .stat span{font-size:13px;color:#607087}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white} .secondary{background:#e7f1fb;color:var(--blue)} .danger{background:#fdebed;color:var(--red)}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5dce5;border-radius:10px;margin:5px 0 11px;font-size:16px}
label{font-size:13px;font-weight:700} textarea{min-height:76px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sponsor{margin:10px 0} .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3f8}
.money{font-weight:800;color:var(--blue);margin-top:7px}
.muted{color:#68778b;font-size:13px;line-height:1.4} h2{font-size:18px;margin:8px 0}
.hidden{display:none} .empty{text-align:center;color:#718096;padding:28px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>

iiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//R/fyiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//S/fyiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//Z" alt="Elternverein RG Stützpunkt Zürich"></div>
  <div class="stats">
    <div class="card stat"><b id="sumPledged">CHF 0</b><span>zugesagt</span></div>
    <div class="card stat"><b id="sumReceived">CHF 0</b><span>erhalten</span></div>
    <div class="card stat"><b id="countGoods">0</b><span>Sachspenden</span></div>
    <div class="card stat"><b id="countOpen">0</b><span>Anfragen offen</span></div>
  </div>

  <div class="actions">
    <button class="primary" onclick="showForm()">+ Sponsor erfassen</button>
    <button class="secondary" onclick="showNeeds()">Wir suchen</button>
    <button class="secondary" onclick="showSponsors()">Sponsoren</button>
  </div>

  <section id="formSec" class="card hidden">
    <h2 id="formTitle">Neuen Sponsor erfassen</h2>
    <input type="hidden" id="editId">
    <label>Firmenname *</label><input id="company" placeholder="z. B. Migros Bank">
    <div class="row"><div><label>Verantwortlich *</label><input id="owner" placeholder="Name Elternteil"></div>
    <div><label>Datum Anfrage</label><input id="date" type="date"></div></div>
    <label>Kontaktperson</label><input id="contact" placeholder="Name, E-Mail oder Telefon">
    <div class="row"><div><label>Art</label><select id="type"><option>Geldsponsoring</option><option>Sachspende</option></select></div>
    <div><label>Status</label><select id="status"><option>Idee</option><option>Angefragt</option><option>In Abklärung</option><option>Zugesagt</option><option>Erhalten</option><option>Absage</option></select></div></div>
    <label>Betrag / geschätzter Wert CHF</label><input id="amount" type="number" min="0" step="1" placeholder="z. B. 10000">
    <label>Leistung / Bemerkung</label><textarea id="note" placeholder="z. B. 100 Geschenke für Athletinnen"></textarea>
    <div class="actions"><button class="primary" onclick="saveSponsor()">Speichern</button><button class="secondary" onclick="showSponsors()">Abbrechen</button></div>
  </section>

  <section id="needSec" class="card hidden">
    <h2>Wir suchen</h2>
    <label>Was wird benötigt?</label><input id="needName" placeholder="z. B. 50 Bälle">
    <label>Geschätzter Wert CHF</label><input id="needValue" type="number" min="0">
    <label>Verantwortlich</label><input id="needOwner" placeholder="Name Elternteil">
    <button class="primary" onclick="addNeed()">Bedarf erfassen</button>
    <div id="needs"></div>
  </section>

  <section id="listSec">
    <div class="card"><input id="search" placeholder="Sponsor suchen …" oninput="render()"></div>
    <div id="list"></div>
  </section>
</div>
<script>
const K='rg_sponsors_v1', NK='rg_needs_v1';
let sponsors=JSON.parse(localStorage.getItem(K)||'[]');
if(!localStorage.getItem(K) && sponsors.length===0){
  sponsors=[{
    id:'swarovski-1',
    company:'Swarovski',
    owner:'Sinem Schudel',
    date:'',
    contact:'',
    type:'Sachspende',
    status:'Zugesagt',
    amount:0,
    note:'Geschenke für die Athletinnen – sie machen mit.'
  }];
  localStorage.setItem(K,JSON.stringify(sponsors));
}
let needs=JSON.parse(localStorage.getItem(NK)||'[]');
const $=id=>document.getElementById(id);
const chf=n=>'CHF '+Number(n||0).toLocaleString('de-CH');
function persist(){localStorage.setItem(K,JSON.stringify(sponsors));localStorage.setItem(NK,JSON.stringify(needs));}
function stats(){
 $('sumPledged').textContent=chf(sponsors.filter(x=>['Zugesagt','Erhalten'].includes(x.status)).reduce((a,x)=>a+Number(x.amount||0),0));
 $('sumReceived').textContent=chf(sponsors.filter(x=>x.status==='Erhalten').reduce((a,x)=>a+Number(x.amount||0),0));
 $('countGoods').textContent=sponsors.filter(x=>x.type==='Sachspende'&&['Zugesagt','Erhalten'].includes(x.status)).length;
 $('countOpen').textContent=sponsors.filter(x=>['Angefragt','In Abklärung'].includes(x.status)).length;
}
function showSponsors(){$('formSec').classList.add('hidden');$('needSec').classList.add('hidden');$('listSec').classList.remove('hidden');render();}
function showForm(id=''){$('listSec').classList.add('hidden');$('needSec').classList.add('hidden');$('formSec').classList.remove('hidden'); clearForm(); if(id) editSponsor(id);}
function showNeeds(){$('listSec').classList.add('hidden');$('formSec').classList.add('hidden');$('needSec').classList.remove('hidden');renderNeeds();}
function clearForm(){['editId','company','owner','date','contact','amount','note'].forEach(i=>$(i).value='');$('type').value='Geldsponsoring';$('status').value='Idee';$('formTitle').textContent='Neuen Sponsor erfassen';}
function saveSponsor(){
 if(!$('company').value.trim()||!$('owner').value.trim()) return alert('Bitte Firmenname und Verantwortliche Person eintragen.');
 const obj={id:$('editId').value||Date.now().toString(),company:$('company').value.trim(),owner:$('owner').value.trim(),date:$('date').value,contact:$('contact').value.trim(),type:$('type').value,status:$('status').value,amount:Number($('amount').value||0),note:$('note').value.trim()};
 const i=sponsors.findIndex(x=>x.id===obj.id); if(i>=0)sponsors[i]=obj;else sponsors.unshift(obj); persist();stats();showSponsors();
}
function editSponsor(id){const x=sponsors.find(x=>x.id===id); if(!x)return; $('editId').value=x.id;$('company').value=x.company;$('owner').value=x.owner;$('date').value=x.date||'';$('contact').value=x.contact||'';$('type').value=x.type;$('status').value=x.status;$('amount').value=x.amount||'';$('note').value=x.note||'';$('formTitle').textContent='Sponsor bearbeiten';}
function delSponsor(id){if(confirm('Eintrag wirklich löschen?')){sponsors=sponsors.filter(x=>x.id!==id);persist();stats();render();}}
function render(){
 const q=$('search').value.toLowerCase(); const arr=sponsors.filter(x=>(x.company+' '+x.owner+' '+x.note).toLowerCase().includes(q));
 $('list').innerHTML=arr.length?arr.map(x=>`<div class="card sponsor"><div class="top"><div><h2>${esc(x.company)}</h2><div class="muted">👤 ${esc(x.owner)} · ${esc(x.type)}${x.date?' · '+x.date:''}</div></div><span class="badge">${esc(x.status)}</span></div>${x.note?`<p>${esc(x.note)}</p>`:''}<div class="money">${chf(x.amount)}</div><div class="actions"><button class="secondary" onclick="showForm('${x.id}')">Bearbeiten</button><button class="danger" onclick="delSponsor('${x.id}')">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Sponsoren erfasst.</div>';
}
function addNeed(){if(!$('needName').value.trim())return alert('Bitte Bedarf eintragen.');needs.unshift({id:Date.now().toString(),name:$('needName').value.trim(),value:Number($('needValue').value||0),owner:$('needOwner').value.trim(),done:false});$('needName').value='';$('needValue').value='';$('needOwner').value='';persist();renderNeeds();}
function toggleNeed(id){const x=needs.find(n=>n.id===id);x.done=!x.done;persist();renderNeeds();}
function renderNeeds(){$('needs').innerHTML=needs.map(n=>`<div class="card sponsor"><div class="top"><div><h2>${esc(n.name)}</h2><div class="muted">${n.owner?'👤 '+esc(n.owner):'Noch nicht übernommen'} · ${chf(n.value)}</div></div><span class="badge">${n.done?'Sponsor gefunden':'Offen'}</span></div><button class="secondary" onclick="toggleNeed('${n.id}')">${n.done?'Wieder öffnen':'Als gefunden markieren'}</button></div>`).join('');}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
stats();render();
</script></body></html>
